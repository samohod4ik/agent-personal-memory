name: CI

on:
  push:
    branches:
      - main
      - 'lanes/pm-oss-*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Note: the optional [mcp] extra is intentionally not installed here yet;
      # it lands with T9 (thin MCP facade) in PH-3.
      - name: Install package
        run: pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run bench self-tests
        run: python -m unittest discover -s bench

      - name: Run bench (component, 1 repeat)
        run: python bench/run_bench.py component --repeats 1

      - name: Privacy hygiene scan
        run: python tools/hygiene_scan.py
